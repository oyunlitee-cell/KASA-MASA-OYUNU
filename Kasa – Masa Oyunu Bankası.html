let LANG='tr';try{LANG=localStorage.getItem('kasa.lang')||'tr'}catch(e){}
const LANGS=[['tr','Türkçe'],['en','English'],['es','Español'],['pt','Português'],['fr','Français'],['de','Deutsch'],['it','Italiano'],['ru','Русский'],['ar','العربية'],['zh','中文'],['ja','日本語'],['ko','한국어'],['hi','हिन्दी']];
const EN={bank:'BANK',hint:'Press and hold a card, then drag',pass:'PASSED START',payAll:'PAY EVERYONE',colAll:'COLLECT FROM ALL',undo:'UNDO',undoShort:'UNDO',undone:'Undone',amt:'Amount',perHead:'Amount per player',cnt:'Players',total:'Total',payer:'Payer',recv:'Receiver',enter:'Enter an amount.',bankLow:'The bank does not have enough money.',noPlayer:'Cannot undo: the player was removed.',badAmt:'Enter a valid amount.',fail:'This action could not be completed.',min2:'At least 2 players required.',emptyName:'Player name cannot be empty.',dupName:'A player with this name already exists.',max:'At most 8 players.',setup:'GAME SETTINGS',gname:'Game name (optional)',cur:'Currency',startM:'Starting money',passM:'Passing-start money',bankM:'Bank starting balance',unl:'Unlimited bank',players:'Players',pname:'Player name',startG:'START GAME',hist:'TRANSACTION HISTORY',noTx:'No transactions yet. Drag a card to begin.',newG:'NEW GAME',newMsg:'The current game and its history will be deleted. Continue?',del:'DELETE',menu:'GAME MENU',close:'CLOSE',startTx:'Passed Start',fromN:'{k} players → {n}',toN:'{n} → {k} players',noPool:'No saved players yet. Add one with + CREATE.',create:'+ CREATE',mkBtn:'CREATE',newP:'NEW PLAYER',leave:'Remove {n} from the game? Their balance goes to the bank.',delPool:'Permanently delete {n} from saved players?',hue:'Hue',sat:'Saturation',val:'Brightness',passSh:'START',lang:'Language',sound:'SOUND SETTINGS',soundOn:'Sound effects',vol:'Volume',preview:'Preview',premium:'Premium',locked:'Premium pack: you can preview it; purchase is required to use it.',exitQ:'Are you sure you want to leave the game?',yes:'YES',no:'NO',adLabel:'Ad space',pk_classic:'Classic Register',pk_digital:'Modern Digital',pk_minimal:'Minimal',pk_casino:'Casino',pk_luxury:'Luxury',pk_retro:'Retro',ok:'CONFIRM',cancel:'CANCEL'};
const K=['ok','cancel','payAll','colAll','pass','passSh','undo','hist','players','startG','exitQ','yes','no','newG'];
const PK_={es:['ACEPTAR','CANCELAR','PAGAR A TODOS','COBRAR A TODOS','PASÓ POR LA SALIDA','SALIDA','DESHACER','HISTORIAL','JUGADORES','INICIAR JUEGO','¿Seguro que quieres salir del juego?','SÍ','NO','NUEVO JUEGO'],

const L={tr:TR,en:EN};for(const c in PK_)L[c]=Object.fromEntries(K.map((k,i)=>[k,PK_[c][i]]));
const T=(k,p={})=>String((L[LANG]&&L[LANG][k])||EN[k]||TR[k]||k).replace(/\{(\w+)\}/g,(_,x)=>p[x]);

/* ===== İşlem motoru (saf, tamsayı) ===== */
const BANK='bank',uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const gp=(s,id)=>s.players.find(p=>p.id===id);
function applyLegs(s,legs,rev){ // atomik: önce doğrula, sonra uygula
  const d=new Map();
  for(const l of legs){const f=rev?l.to:l.from,t=rev?l.from:l.to;d.set(f,(d.get(f)||0)-l.amt);d.set(t,(d.get(t)||0)+l.amt)}
  const short=[];
  for(const[id,v]of d){
    if(id===BANK){if(!s.set.unl&&s.bank+v<0)short.push(id)}
    else if(!gp(s,id))return{err:'gone'}
  }
  if(short.length)return{err:'funds',short};
  for(const[id,v]of d){if(id===BANK){if(!s.set.unl)s.bank+=v}else gp(s,id).bal+=v}
  return{ok:true};
}
function record(s,type,legs,x={}){
  if(!legs.length||legs.some(l=>!Number.isSafeInteger(l.amt)||l.amt<=0||l.from===l.to))return{err:'amount'};
  const r=applyLegs(s,legs);if(r.err)return r;
  const names={};legs.forEach(l=>[l.from,l.to].forEach(i=>names[i]=i===BANK?T('bank'):gp(s,i).name));
  const tx={id:uid(),type,ts:Date.now(),legs,names,undone:false,...x};
  s.tx.push(tx);return{ok:true,tx};
}
const transferMoney=(s,a,b,amt)=>record(s,'p2p',[{from:a,to:b,amt}],{a,b});
const transferFromBank=(s,b,amt)=>record(s,'bank_in',[{from:BANK,to:b,amt}],{b});
const transferToBank=(s,a,amt)=>record(s,'bank_out',[{from:a,to:BANK,amt}],{a});
const payEveryone=(s,a,per)=>record(s,'pay_all',s.players.filter(p=>p.id!==a).map(p=>({from:a,to:p.id,amt:per})),{a,per});
const collectFromEveryone=(s,b,per)=>record(s,'col_all',s.players.filter(p=>p.id!==b).map(p=>({from:p.id,to:b,amt:per})),{b,per});
const passStart=(s,b)=>record(s,'start',[{from:BANK,to:b,amt:s.set.pass}],{b});
function undoTransaction(s,id){
  const tx=s.tx.find(t=>t.id===id);if(!tx||tx.undone)return{err:'fail'};
  const r=applyLegs(s,tx.legs,true);if(r.err)return r;
  tx.undone=true;tx.undoneAt=Date.now();return{ok:true,tx};
}
function selfTest(){ // #test ile çalıştırılır
  const mk=()=>({set:{pass:200,unl:false},bank:1000,tx:[],players:[{id:'a',name:'A',bal:500},{id:'b',name:'B',bal:100},{id:'c',name:'C',bal:50}]});
  const tot=s=>s.bank+s.players.reduce((x,p)=>x+p.bal,0),R=[];let s=mk();
  R.push(transferMoney(s,'a','b',300).ok&&s.players[1].bal===400);
  R.push(payEveryone(s,'c',30).ok&&s.players[2].bal===-60);
  R.push(collectFromEveryone(s,'a',50).ok);s.set.unl=true;R.push(passStart(s,'a').ok&&s.bank===1000);s.set.unl=false;
  s=mk();R.push(payEveryone(s,'a',100).ok&&s.players[0].bal===300);const t=s.tx[0].id;
  R.push(undoTransaction(s,t).ok&&s.players[0].bal===500&&!undoTransaction(s,t).ok);
  R.push(passStart(s,'b').ok&&tot(s)===1650);R.push(transferMoney(s,'b','a',99999).ok&&tot(s)===1650);
  return R;
}

  if(!SND.on&&!pid)return;const p=PACKS[pid||SND.pack]||PACKS.classic;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
    (p[kind]||p.pay).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*p.d;o.type=p.w;o.frequency.value=f;

}
function sheetH(){return `<div class="dlg"><h2>${T('menu')}</h2><div class="ph" style="margin-top:0"><b>${T('players')} <small>${S.players.length}/8</small></b><button class="b2 sm" data-a="new" ${POOL.length>=8?'disabled':''}>${T('create')}</button></div><div class="chips">${chips()}</div><label>${T('lang')}${langSel().replace('width:auto','width:100%')}</label><button class="b2" style="width:100%;margin-top:10px" data-a="snd">🔊 ${T('sound')}</button><div class="btns" style="margin-top:12px"><button class="b2" data-a="newg">${T('newG')}</button><button class="b1" data-a="close">${T('close')}</button></div></div>`}
function openSheet(){sheetFn=sheetH;layer('#ov',sheetH())}
function initDraft(set,sel){const s=set||(LAST&&LAST.set)||{};draft={name:s.name||'',cur:s.cur||CURS[0][0],start:s.start||1500,pass:s.pass??200,bank0:s.bank0??50000,unl:!!s.unl,sel:new Set((sel||(LAST&&LAST.sel)||[]).filter(id=>POOL.some(p=>p.id===id)))}}
function refresh(){if(sheetFn)layer('#ov',sheetFn());render()}
function sumTx(tx){const n=tx.names,B=T('bank');const t={p2p:`${n[tx.a]} → ${n[tx.b]}`,bank_in:`${B} → ${n[tx.b]}`,bank_out:`${n[tx.a]} → ${B}`,start:`${n[tx.b]} · ${T('startTx')}`,pay_all:`${n[tx.a]} → ${T('payAll')}`,col_all:`${T('colAll')} → ${n[tx.b]}`}[tx.type],a=txView(tx).amt;return`✓ ${t}\n${a>0?'+':''}${fmt(a)}`}
function act(a,v,b){
  switch(a){
    case'hist':view='hist';render();break;
    case'back':view='main';render();break;
    case'menu':openSheet();break;
    case'close':closeOv();break;
    case'hint':b.classList.add('nd');setTimeout(()=>b.classList.remove('nd'),350);break;
    case'snd':sheetFn=soundH;layer('#ov',soundH());break;
    case'pk':if(!Store.owns(v)){toast(T('locked'));play('pay',v);break}SND.pack=v;saveSnd();refresh();play('pay',v);break;
    case'pvw':play('pay',v);break;
    case'pass':{const r=passStart(S,v);if(r.err)return toast(errMsg(r,S));save();render();vib(20);flash(r.tx);play('start');break}
    case'undo':{const r=undoTransaction(S,v);if(r.err)return toast(errMsg(r,S));save();vib(20);render();flash(r.tx,1);play('undo');break}
    case'exp':expanded.has(v)?expanded.delete(v):expanded.add(v);render();break;
    case'confirm':{const r=DLG.op(S,num(DLG.inp.value));if(r.err)return DLG.upd();save();closeOv();render();vib(25);flash(r.tx);play(/_all$/.test(r.tx.type)?'group':'pay');break}
    case'key':{let x=DLG.inp.value;x=v==='del'?x.slice(0,-1):(x+v).replace(/^0+/,'').slice(0,9);DLG.inp.value=x;DLG.upd();vib(5);break}
    case'adj':DLG.inp.value=v;DLG.upd();break;
    case'new':if(POOL.length>=8)return toast(T('max'));createDlg();break;
    case'mk':{
      const n=CP.name.trim();
      if(!n)return toast(T('emptyName'));
      if(POOL.some(p=>p.name.toLowerCase()===n.toLowerCase()))return toast(T('dupName'));
      if(POOL.length>=8)return toast(T('max'));
      POOL.push({id:uid(),name:n,color:hex(CP.h,CP.s,CP.v)});savePool();layer('#ov2','');refresh();break}
    case'tog':{
      if(view==='setup'){
        if(draft.sel.has(v))draft.sel.delete(v);else{if(draft.sel.size>=8)return toast(T('max'));draft.sel.add(v)}
        render();break}
      const p=S.players.find(x=>x.id===v);
      if(!p){if(S.players.length>=8)return toast(T('max'));const q=POOL.find(x=>x.id===v);S.players.push({id:q.id,name:q.name,color:q.color,bal:S.set.start});save();refresh();break}
      if(S.players.length<=2)return toast(T('min2'));
      confirmDlg(T('leave',{n:p.name}),T('del'),()=>{
        if(p.bal>0){const r=transferToBank(S,p.id,p.bal);if(r.err)return toast(errMsg(r,S))}
        S.players=S.players.filter(x=>x.id!==v);save();refresh()});break}
    case'dp':{const p=POOL.find(x=>x.id===v);
      confirmDlg(T('delPool',{n:p.name}),T('del'),()=>{POOL=POOL.filter(x=>x.id!==v);draft.sel.delete(v);savePool();refresh()});break}
    case'c2':layer('#ov2','');break;
    case'ok2':{const f=DLG2;layer('#ov2','');f&&f();break}
    case'newg':confirmDlg(T('newMsg'),T('newG'),()=>{ // havuz silinmez; yalnızca oyun sıfırlanır
      initDraft(S.set,S.players.map(p=>p.id));S=null;try{localStorage.removeItem(KEY)}catch(e){}closeOv();prevBal={};expanded.clear();view='setup';render()});break;
    case'start':{
      const d=draft;if(d.sel.size<2)return toast(T('min2'));
      const ps=POOL.filter(p=>d.sel.has(p.id)).slice(0,8),st=num(d.start);
      S={set:{name:d.name.trim(),cur:d.cur||CURS[0][0],start:st,pass:num(d.pass),unl:d.unl,bank0:num(d.bank0)},bank:num(d.bank0),players:ps.map(p=>({id:p.id,name:p.name,color:p.color,bal:st})),tx:[]};
      LAST={sel:ps.map(p=>p.id),set:S.set};savePool();save();view='main';prevBal={};render();break}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v,b);else if(e.target.id==='ov'&&!DLG2)closeOv()});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==='cpn')CP.name=t.value;else if(f.startsWith('cp')){CP[f[2]]=+t.value;pv()}
  else if(f==='unl'){draft.unl=t.checked;render()}
  else if(f==='lang'){LANG=t.value;try{localStorage.setItem('kasa.lang',LANG)}catch(e){}document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';refresh()}
  else if(f==='son'){SND.on=t.checked;saveSnd()}else if(f==='vol'){SND.vol=t.value/100;saveSnd()}
  else if(view==='setup'&&f in draft)draft[f]=t.value;
});
/* ===== Geri tuşu / kenar kaydırma ===== */
let quit=false;try{history.pushState({k:1},'')}catch(e){}
addEventListener('popstate',()=>{
  if(quit)return;try{history.pushState({k:1},'')}catch(e){}
  if(D)return;
  if($('#ov2').style.display==='flex')return layer('#ov2','');
  if($('#ov').style.display==='flex')return closeOv();
  if(view==='hist'){view='main';return render()}
  confirmDlg(T('exitQ'),T('yes'),()=>{quit=true;history.go(-1);setTimeout(()=>{try{window.close()}catch(e){}},200)},T('no'));
});
if(location.hash==='#test')console.log('Testler',selfTest());
initDraft(S&&S.set,S&&S.players.map(p=>p.id));
render();
</script></body></html>
